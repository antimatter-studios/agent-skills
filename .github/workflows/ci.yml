name: CI

# This repo had no CI at all, which is how three consecutive fixes to the same
# guard (#23, #24, #25) each shipped a behaviour nobody could run. The guards are
# shell scripts that talk to the GitHub API and then change branch protection, so
# a regression here silently locks a repo's merges rather than failing loudly.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One job, so the required status check is a single name that always reports —
# see .githooks/required-checks. Adding a second job means adding an always-run
# aggregate that `needs:` both, not requiring another name.
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # What counts as a script: any file with a shebang. Git hooks are
      # extensionless by necessity, so a name-based rule either misses the
      # dispatchers or sweeps up data files that live beside them —
      # .githooks/required-checks was linted as shell on the first run here.
      - name: Collect scripts
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -type f -print \
          | while IFS= read -r f; do
              IFS= read -r first < "$f" 2>/dev/null || continue
              case "$first" in '#!'*) printf '%s\0' "$f" ;; esac
            done > scripts.z
          tr '\0' '\n' < scripts.z | sed 's/^/  /'
          test -s scripts.z

      - name: Syntax
        run: xargs -0 -n1 bash -n < scripts.z && echo "all scripts parse"

      - name: ShellCheck
        run: |
          set -euo pipefail
          # -S error, not the default: the guards deliberately use idioms
          # shellcheck flags at warning level — word-splitting a `set --` on
          # purpose, glob patterns in `case`, `read -r` into a variable only some
          # branches use, and the `A && B || C` fail-open idiom. Each is commented
          # where it happens. Errors are real breakage; behaviour is covered by
          # the test suite below rather than by style rules.
          #
          # -P SCRIPTDIR resolves `# shellcheck source=` relative to the script,
          # not the working directory, so lib/common.sh is actually followed.
          xargs -0 shellcheck -x -P SCRIPTDIR -S error < scripts.z
          echo "shellcheck clean"

      # Every tests/*.sh under any skill, so adding a suite needs no change here.
      # git is configured because a test that runs `git init` + `git commit` has
      # no identity on a runner.
      - name: Tests
        run: |
          set -euo pipefail
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          found=0
          for t in .claude/skills/*/tests/*.sh; do
            [ -e "$t" ] || continue
            found=1
            printf '\n=== %s\n' "$t"
            bash "$t"
          done
          [ "$found" = 1 ] || { echo "no test suites found" >&2; exit 1; }
